  /run-results/{id}/analyses/{analysisId}/explain:
    post:
      description: Asks the default LLM to explain a TypeSafe decision whose explanation
        was skipped, unavailable or unreadable, and stores the explanation on the
        same analysis. The verdict, confidence and suggestion do not change. 409 when
        the analysis is not an unexplained TypeSafe decision, AI is switched off,
        or no LLM provider is available. 409 also when the explanation's estimated
        cost exceeds a soft AI budget and acknowledge_budget is not true.
      parameters:
      - description: Run result ID
        in: path
        name: id
        required: true
        type: string
      - description: Analysis ID
        in: path
        name: analysisId
        required: true
        type: string
      - description: Proceed although a soft AI budget would be exceeded
        in: query
        name: acknowledge_budget
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.RunResultAnalysis'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Explain a stored TypeSafe decision
      tags:
      - ai-failure-analysis
  /run-results/{id}/analyze:
    post:
      description: 'Runs failure analysis on one result now and stores it as a new
        version. A failed attempt is stored too and returned with 502. 409 when AI
        is switched off, or when the estimated cost exceeds a soft AI budget and acknowledge_budget
        is not true (payload: category "budget", scope, estimated_cost_usd, budget_usd,
        month_spent_usd).'
