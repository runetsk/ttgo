      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List test cases
      tags:
      - tests
    post:
      consumes:
      - application/json
      description: Creates a new test case
      parameters:
      - description: Test case payload
        in: body
        name: body
        required: true
        schema:
          properties:
            custom_values:
              items:
                $ref: '#/definitions/ttgo_pkg_tracker_models.CustomFieldValue'
              type: array
            description:
              type: string
            folder_id:
              type: string
            name:
              type: string
            steps:
              items:
                $ref: '#/definitions/ttgo_pkg_tracker_models.TestStep'
              type: array
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a test case
      tags:
      - tests
  /tests/{id}:
    delete:
      description: Deletes the test case with the given ID. Run results are preserved
        with a NULL test_case_id.
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a test case
      tags:
      - tests
    get:
      consumes:
      - application/json
      description: Returns a single test case by ID
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a test case
      tags:
      - tests
    put:
      consumes:
      - application/json
      description: Updates an existing test case by ID
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      - description: Test case update payload
        in: body
        name: body
        required: true
        schema:
          properties:
            categories:
              items:
                $ref: '#/definitions/ttgo_pkg_tracker_models.Category'
              type: array
            custom_values:
              items:
                $ref: '#/definitions/ttgo_pkg_tracker_models.CustomFieldValue'
              type: array
            description:
              type: string
            folder_id:
              type: string
            name:
              type: string
            steps:
              items:
                $ref: '#/definitions/ttgo_pkg_tracker_models.TestStep'
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a test case
      tags:
      - tests
  /tests/{id}/categories:
    post:
      consumes:
      - application/json
      description: Associates a category with the specified test case
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      - description: Category assignment payload
        in: body
        name: body
        required: true
        schema:
          properties:
            category_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assign a category to a test case
      tags:
      - tests
  /tests/{id}/defect-links:
    get:
      description: Returns all defects linked to the specified test case.
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ttgo_pkg_tracker_models.Defect'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List defects for a test case
      tags:
      - tests
    post:
      consumes:
      - application/json
      description: Links an existing defect to the specified test case (case-scoped
        link).
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      - description: Defect to link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ttgo_pkg_tracker_models.LinkDefectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.DefectLink'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Link a defect to a test case
      tags:
      - tests
  /tests/{id}/defect-links/{defect_id}:
    delete:
      description: Removes the case-scoped defect link from the specified test case.
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      - description: Defect ID
        in: path
        name: defect_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Unlink a defect from a test case
      tags:
      - tests
  /tests/{id}/requirements:
    get:
      description: Returns all requirements linked to the given test case, ordered
        by identifier.
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ttgo_pkg_tracker_models.Requirement'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List requirements linked to a test case
      tags:
      - requirements
  /tests/{id}/reverification-flag:
    delete:
      description: Clears the reverification_flagged state for the given test case.
      parameters:
      - description: Test case ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Dismiss the reverification flag
      tags:
      - tests
  /tests/bulk-delete:
    post:
      consumes:
      - application/json
      description: Deletes multiple test cases by their IDs. Run results are preserved
        with a NULL test_case_id.
      parameters:
      - description: List of test case IDs to delete
        in: body
        name: body
        required: true
        schema:
          properties:
            ids:
              items:
                type: string
              type: array
          type: object
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bulk delete test cases
      tags:
      - tests
  /tests/by-custom-field:
    get:
      description: Returns the test case whose custom field matches the given name
        and value
      parameters:
      - description: Custom field name (e.g. ExternalId)
        in: query
        name: field
        required: true
        type: string
      - description: Custom field value to match
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Find a test case by custom field value
      tags:
      - tests
  /tests/export:
    post:
      consumes:
      - application/json
      description: Exports selected test cases as a downloadable JSON file with configurable
        fields
      parameters:
      - description: Test case IDs and fields to include
        in: body
        name: body
        required: true
        schema:
          properties:
            fields:
              items:
                type: string
              type: array
            ids:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export test cases as JSON
      tags:
      - tests
  /tokens:
    get:
      description: Return all API tokens
      produces:
      - application/json
      responses:
        "200":
          description: tokens array and total count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List API tokens
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Create a new API token with the given description and scope
      parameters:
      - description: Token description (required) and scope (read|write)
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            scope:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an API token
      tags:
      - tokens
  /tokens/{id}:
    delete:
      description: Delete an existing API token by ID
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an API token
      tags:
      - tokens
  /traceability:
    get:
      description: Returns all requirements with their linked test cases and an aggregate
        coverage summary. Optional ?q= text filter and ?uncovered=true gap filter
        are applied server-side for API consumers; the React UI filters client-side.
      parameters:
      - description: Case-insensitive substring filter on identifier and title
        in: query
        name: q
        type: string
      - description: If true, return only requirements with no linked test cases
        in: query
        name: uncovered
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the traceability matrix
      tags:
      - traceability
  /uploads/screenshots/{result_id}/{filename}:
    get:
      description: Serve a screenshot file from disk by result ID and filename.
      parameters:
      - description: Run result ID
        in: path
        name: result_id
        required: true
        type: string
      - description: Screenshot filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Serve screenshot
      tags:
      - runs
  /users:
    get:
      description: Returns all user accounts. Admin session required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              total:
                type: integer
              users:
                type: array
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user account. Admin session required.
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          properties:
            display_name:
              type: string
            email:
              type: string
            password:
              type: string
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Marks a user as deleted. Evicts all sessions. Admin session required.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: Soft-delete user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Partially update a user account (deactivate, reactivate, change
        role, reset password). Admin session required.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update (hidden removed)
        in: body
        name: body
        schema:
          properties:
            active:
              type: boolean
            display_name:
              type: string
            password:
              type: string
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: Update user
      tags:
      - users
  /users/{id}/restore:
    post:
      description: Restores a soft-deleted user. User comes back as inactive. Admin
        session required.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: Restore deleted user
      tags:
      - users
  /users/assignable:
    get:
      description: Returns active, non-deleted users (minimal fields) for assignee
        pickers. Any authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              users:
                type: array
            type: object
      summary: List assignable users
      tags:
      - users
  /webhooks:
    get:
      description: Return all webhook configurations
      produces:
      - application/json
      responses:
        "200":
          description: webhooks array and total count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List webhooks
      tags:
      - webhooks
    post:
      consumes:
      - application/json
      description: Create a new webhook configuration with the given URL, description,
        and event type
      parameters:
      - description: Webhook URL (required), description, and event_type
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            event_type:
              type: string
            url:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a webhook
      tags:
      - webhooks
  /webhooks/{id}:
    delete:
      description: Delete an existing webhook configuration by ID
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a webhook
      tags:
      - webhooks
  /webhooks/{id}/logs:
    get:
      description: Return paginated dispatch logs for a webhook
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: string
      - default: 50
        description: Maximum number of logs to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of logs to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: logs array and total count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get webhook dispatch logs
      tags:
      - webhooks
  /webhooks/{id}/rotate-secret:
    post:
      description: Generate a new HMAC signing secret for a webhook, invalidating
        the old one
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: id and new plaintext secret
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rotate a webhook's signing secret
      tags:
      - webhooks
  /ws:
    get:
      description: Upgrade to a WebSocket connection for real-time event streaming.
        Authenticates via session_token cookie. Sends JSON-encoded events for entity
        changes (test cases, runs, backups, etc.).
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionCookie: []
      summary: WebSocket connection
      tags:
      - websocket
securityDefinitions:
  BearerAuth:
    description: 'Enter: "Bearer <your-token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
