  /runs:
    get:
      consumes:
      - application/json
      description: Returns test runs with optional filtering by category list, status,
        date ranges, and folder.
      parameters:
      - description: Comma-separated list of category IDs to filter by (OR logic)
        in: query
        name: category_ids
        type: string
      - description: Single category ID (backward-compatible alias; overridden by
          category_ids)
        in: query
        name: category_id
        type: string
      - description: Filter by run status (e.g. PENDING, PASS, FAIL)
        in: query
        name: status
        type: string
      - description: Include runs created on or after this date (YYYY-MM-DD, UTC)
        in: query
        name: created_from
        type: string
      - description: Include runs created on or before this date inclusive (YYYY-MM-DD,
          UTC)
        in: query
        name: created_to
        type: string
      - description: Include runs updated on or after this date (YYYY-MM-DD, UTC)
        in: query
        name: updated_from
        type: string
      - description: Include runs updated on or before this date inclusive (YYYY-MM-DD,
          UTC)
        in: query
        name: updated_to
        type: string
      - description: 'Sort column: name, status, created_at, updated_at'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: ASC or DESC (default DESC)'
        in: query
        name: order
        type: string
      - description: Page size (default 50)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      - description: Filter by folder ID; use 'uncategorised' for runs with no folder
        in: query
