  ttgo_pkg_tracker_models.RunResult:
    properties:
      app_version:
        type: string
      attempt_number:
        type: integer
      browser:
        description: Context
        type: string
      closed_defect_link_count:
        type: integer
      created_at:
        description: Timestamps
        type: string
      decided_at:
        description: |-
          DecidedAt is the instant the human triage decision above was recorded, written in UTC
          alongside the snapshot columns and NULL until a real decision lands.

          The accuracy window is measured on this column and NOT on UpdatedAt: UpdatedAt means
          "row last touched" and is re-stamped by writes that are not decisions at all — a
          screenshot/log edit, a plain status change, or the test-case delete cascade NULLing
          TestCaseID across every historical result — any of which would silently drag old
          decisions into a recent window.

          UTC is load-bearing: SQLite stores time as TEXT with the writer's offset and compares it
          as TEXT, so a local-offset value measured against a UTC cutoff is skewed by that offset.
        type: string
      defect_type:
        description: |-
          DefectType classifies the failure reason for failing results — FAIL and ERROR alike, per
          IsFailureStatus. Every other status forces "" (there is nothing to triage).
          Values: "to_investigate" | "product_bug" | "automation_bug" | "system_issue" | "" (not applicable)
        type: string
      duration_ms:
        description: Timing
        type: integer
      end_time:
        type: string
      environment:
        type: string
      error_message:
        description: Failure Details
        type: string
      failure_type:
        type: string
      id:
        type: string
      log_text:
        type: string
      metadata:
        items:
          type: integer
        type: array
      open_defect_link_count:
        description: Defect link counts (not persisted, populated by GetTestRun)
        type: integer
      os:
        type: string
      screenshots:
        description: Artifacts
        type: string
      stack_trace:
        type: string
      start_time:
        type: string
      status:
        $ref: '#/definitions/ttgo_pkg_tracker_models.ExecutionStatus'
      steps:
        description: Detailed Steps & Metadata
        items:
          type: integer
        type: array
      suggested_confidence:
        type: string
      suggested_confidence_score:
        type: number
      suggested_defect_type:
        type: string
      suggested_engine:
        description: |-
          SuggestedEngine records which engine's suggestion was snapshotted; "" on rows decided
          before engines existed and on rows with no snapshot. SuggestedConfidenceScore is the
          numeric confidence of the DEFECT-TYPE question for typesafe rows (the quantity the
          accuracy metric grades), NULL for generative rows. Both are cleared with the other
          snapshot columns.
        type: string
      suggested_is_clone:
        type: boolean
      suggested_policy_version:
        description: |-
          SuggestedPolicyVersion is the TypeSafe question-set policy of the snapshotted analysis
          ("" for generative rows and for decisions whose provenance is unknown). SuggestedIsClone
          says whether that analysis was a dedup clone, i.e. the group representative's answer copied
          onto this result, rather than a prediction made for it; NULL = unknown (decided before the
          column existed and not recovered by the one-time backfill). The accuracy report counts
          unknown rows in its totals only. Both are written by the triage snapshot and cleared with
          the other snapshot columns.
        type: string
      suggested_verdict:
        description: |-
          Snapshot of what the AI failure analysis suggested at the moment a human explicitly set
          DefectType. Written only on an explicit triage decision on a FAILING result (FAIL or ERROR)
          that has an analysis — never on the AUTO-default path, where a bare status change stamps
          "to_investigate" with no human having chosen anything. Agreement is then a pure comparison of
          SuggestedDefectType vs DefectType.

          Explicitly PICKING "to_investigate" (both endpoints allow it — it is how a reviewer sends a
          row back to the untriaged pile) does write these columns: it is a real request, and treating
          it differently would make the two endpoints disagree on identical input. Such a row still
          contributes nothing to the metric, because accuracyCalibrationFilter counts only the three
          conclusive defect types.

          SuggestedVerdict is kept alongside SuggestedDefectType because the verdict -> defect_type
          mapping is lossy, so the per-verdict breakdown cannot be reconstructed from the mapped value.

          All three are CLEARED whenever a triage decision is written without a snapshot behind it
          (non-failure result, no analysis, lookup failure) so a new decision can never be scored
          against a suggestion left over from an older one.
        type: string
      test_case:
        allOf:
        - $ref: '#/definitions/ttgo_pkg_tracker_models.TestCase'
        description: Association (not stored, loaded via preload)
      test_case_id:
        description: Nullable if test case is deleted; covered by idx_run_results_case_time
        type: string
      test_name_snapshot:
        description: Preserved name
        type: string
      test_run_id:
        type: string
      trace_url:
        type: string
      updated_at:
        type: string
      video:
        type: string
    type: object
  ttgo_pkg_tracker_models.RunResultAnalysis:
    properties:
      confidence:
        type: string
      confidence_score:
        description: TypeSafe verdict confidence 0..1; NULL for generative rows (never
          invented).
        type: number
      created_at:
        type: string
      created_by:
        type: string
      decision_ms:
        description: Stage timing and call accounting for this attempt (representatives
          only; clones are 0).
        type: integer
      decision_status:
        description: |-
          DecisionStatus separates a decision ("ok") from an attempt that produced none
          ("failed"). A failed row keeps Verdict "unknown" only for compatibility: readers must
          check this field, never the verdict, an empty model name or the summary text.
        type: string
      dedup_group_key:
        type: string
      dedup_method:
        description: |-
          Grouping provenance. "" on representatives; on clones: how they were grouped and,
          for semantic clones, the probability/model/policy that justified the merge.
        type: string
      dedup_model:
        type: string
      dedup_p_same:
        type: number
      dedup_policy_version:
        type: string
      defect_type_probabilities:
        type: string
      engine:
        description: Engine that produced Verdict. Legacy rows read as generative
          (column default).
        type: string
      error_category:
        description: |-
          ErrorCategory names why a failed attempt failed (timeout, rate_limit, truncated,
          unparseable, ...), or why a kept TypeSafe decision has no LLM takeover.
        type: string
      finish_reason:
        type: string
      history_available:
        description: |-
          HistoryAvailable: the evidence this analysis was built from carried the test's recent
          failures or the rollup of the labels people gave them (spec B5 #25), so benchmarks can
          grade with and without history apart. Clones copy their representative's value; rows from
          before the column read false.
        type: boolean
      id:
        type: string
      job_id:
        description: JobID is the analysis job that produced the row; nil for single-result
          analyses.
        type: string
      llm_calls:
        type: integer
      llm_ms:
        type: integer
      model_name:
        type: string
      narrative_status:
        type: string
      next_action:
        type: string
      policy_version:
        type: string
      provider_id:
        type: string
      rationale:
        type: string
      raw_response:
        type: string
      run_result_id:
        type: string
      source_analysis_id:
        type: string
      suggested_defect_type:
        description: |-
          SuggestedDefectType is PERSISTED and is the single source of truth for the suggestion.
          typesafe rows: the decided option, or "" when TypeSafe abstained.
          generative rows: SuggestedDefectType(Verdict), written at analysis time (and backfilled).
          No read path may derive it from Verdict any more.
        type: string
      suggested_defect_type_confidence:
        type: number
      suggestion_source:
        description: |-
          SuggestionSource is "" when the suggestion came from the defect-type question (or the
          generative mapping) and SuggestionSourceVerdict when it was derived from a confident
          TypeSafe verdict because the question abstained (policy v4, verdict >= 0.90) or abstained
          or disagreed (v5, verdict >= failureanalysis.VerdictDecidesSuggestionMin).
        type: string
      summary:
        type: string
      takeover_from_confidence:
        type: number
      takeover_from_defect_type:
        type: string
      takeover_from_verdict:
        description: |-
          Takeover provenance: TypeSafe's own decision when its confidence was below the
          takeover threshold and the LLM decided instead. Empty on every other row.
        type: string
      token_usage_completion:
        type: integer
      token_usage_prompt:
        type: integer
      typesafe_input_tokens:
        type: integer
      verdict:
        type: string
      verdict_probabilities:
        type: string
      version:
        type: integer
    type: object
  ttgo_pkg_tracker_models.TestCase:
    properties:
      categories:
        description: Associations
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_models.Category'
        type: array
      closed_defect_count:
        type: integer
      created_at:
        type: string
      custom_values:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_models.CustomFieldValue'
        type: array
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      linked_requirements:
        description: Populated on demand by store.ListRequirementsByTestCase — not
          persisted.
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_models.Requirement'
        type: array
      name:
        type: string
      open_defect_count:
        description: '008-jira-integration: populated on demand by GetFolderTree —
          not persisted.'
        type: integer
      reverification_flagged:
        description: |-
          Set true when the test case has at least one linked defect and every one of them is
          fixed-or-closed, i.e. the test is ready to be retested. "fixed" counts as resolved
          alongside "closed" so the signal fires when QA wants it — before the defect is
          closed, not after. Recomputed by store.recomputeReverification on every defect
          status change, link and unlink; persists until manually dismissed via
          DELETE /api/tests/{id}/reverification-flag.
        type: boolean
      steps:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_models.TestStep'
        type: array
      steps_count:
        description: |-
          Populated on demand by ListTestCases when called with TestCaseFilter.ListView=true.
          Not persisted — avoids the cost of Preload("Steps") when the caller only needs the count.
        type: integer
      updated_at:
        type: string
    type: object
  ttgo_pkg_tracker_models.TestRun:
    properties:
      assignee_id:
        description: nullable, app-validated ref to users.id
        type: string
      assignee_name:
        description: Assignee display name (not persisted, populated by GetTestRuns/GetTestRun/GetTestRunSummary)
        type: string
      automation_bug_count:
        type: integer
      category_id:
        description: nullable — empty runs have no category
        type: string
      closed_defect_link_count:
        type: integer
      comment_count:
        description: Comment count (not persisted, populated by list handler)
        type: integer
      created_at:
        type: string
      failed_results:
        type: integer
      id:
        type: string
      name:
        type: string
      open_defect_link_count:
        description: Defect link counts (not persisted, populated by list handler)
        type: integer
      passed_results:
        type: integer
      pending_results:
        type: integer
      product_bug_count:
        type: integer
      retried_count:
        description: Retry stats (not persisted, populated by GetTestRun/GetTestRuns)
        type: integer
      run_folder_id:
        description: nullable FK to RunFolder
        type: string
      run_results:
        description: Associations
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_models.RunResult'
        type: array
      skipped_results:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/ttgo_pkg_tracker_models.ExecutionStatus'
        description: PENDING, RUNNING, PASS, FAIL, SKIP, ERROR
      system_issue_count:
        type: integer
      to_investigate_count:
        description: Defect type breakdowns (not persisted, populated by GetTestRuns
          list query)
        type: integer
      total_attempts:
        type: integer
      total_results:
        description: Computed aggregate fields (not persisted, populated by GetTestRuns
          list query)
        type: integer
      updated_at:
        type: string
    type: object
  ttgo_pkg_tracker_models.TestStep:
    properties:
      action:
        type: string
      expected_result:
        type: string
      id:
        type: string
      order_index:
        type: integer
      test_case_id:
        type: string
    type: object
  ttgo_pkg_tracker_models.TypeSafeSettingsPatch:
    properties:
      allow_auto_failure_analysis:
        type: boolean
      api_key:
        type: string
      clear_api_key:
        type: boolean
      enabled:
        type: boolean
      escalate_below_pct:
        type: integer
      llm_fallback_enabled:
        type: boolean
      model:
        type: string
      narrative_enabled:
        type: boolean
      price_per_mtok:
        type: number
      semantic_dedup_enabled:
        type: boolean
      timeout_seconds:
        type: integer
      verdict_engine_enabled:
        type: boolean
    type: object
  ttgo_pkg_tracker_models.TypeSafeSettingsResponse:
    properties:
      allow_auto_failure_analysis:
        type: boolean
      api_key_masked:
        type: string
      api_key_status:
        description: missing | ok | undecryptable
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      escalate_below_pct:
        type: integer
      id:
        type: string
      llm_fallback_enabled:
        type: boolean
      model:
        type: string
      narrative_enabled:
        type: boolean
      price_per_mtok:
        type: number
      semantic_dedup_enabled:
        type: boolean
      timeout_seconds:
        type: integer
      updated_at:
        type: string
      verdict_engine_enabled:
        type: boolean
    type: object
  ttgo_pkg_tracker_models.UnparseableItem:
    properties:
      line_number:
        description: Approximate line in the original content
        type: integer
      raw_text:
        description: Original text that couldn't be parsed
        type: string
      reason:
        description: Why parsing failed
        type: string
    type: object
  ttgo_pkg_tracker_models.UpdateDefectRequest:
    properties:
      assignee_id:
        description: '"" clears the assignee, nil leaves it unchanged'
        type: string
      description:
        type: string
      external_key:
        type: string
      external_provider:
        type: string
      external_url:
        type: string
      severity:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  ttgo_pkg_tracker_models.UpdateRunResultRequest:
    properties:
      app_version:
        type: string
      browser:
        type: string
      defect_type:
        type: string
      duration_ms:
        type: integer
      environment:
        type: string
      error_message:
        type: string
      failure_type:
        type: string
      log_text:
        type: string
      os:
        type: string
      screenshots:
        type: string
      stack_trace:
        type: string
      status:
        type: string
      steps:
        items:
          type: integer
        type: array
      trace_url:
        type: string
      video:
        type: string
    type: object
  ttgo_pkg_tracker_store.AIAccuracyConfidenceBucket:
    properties:
      agreed:
        type: integer
      confidence:
        type: string
      rate:
        type: number
      total:
        type: integer
    type: object
  ttgo_pkg_tracker_store.AIAccuracyCoverage:
    properties:
      abstained:
        description: a decision of verdict unknown or with the suggestion withheld
        type: integer
      analyses:
        type: integer
      decided:
        description: a decision with a suggestion
        type: integer
      engine:
        type: string
      failed:
        description: 'no decision: the attempt failed'
        type: integer
      no_explanation:
        description: a decision whose explanation is unavailable, unparseable or skipped
        type: integer
    type: object
  ttgo_pkg_tracker_store.AIAccuracyEngineBucket:
    properties:
      agreed:
        type: integer
      by_confidence:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_store.AIAccuracyConfidenceBucket'
        type: array
      clone_agreed:
        type: integer
      clone_total:
        type: integer
      direct_agreed:
        type: integer
      direct_rate:
        type: number
      direct_total:
        type: integer
      engine:
        type: string
      rate:
        type: number
      total:
        type: integer
    type: object
  ttgo_pkg_tracker_store.AIAccuracyVerdictBucket:
    properties:
      agreed:
        type: integer
      rate:
        type: number
      total:
        type: integer
      verdict:
        type: string
    type: object
  ttgo_pkg_tracker_store.AIFailureAnalysisAccuracy:
    properties:
      agreed:
        type: integer
      agreement_rate:
        type: number
      by_confidence:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_store.AIAccuracyConfidenceBucket'
        type: array
      by_engine:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_store.AIAccuracyEngineBucket'
        type: array
      by_verdict:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_store.AIAccuracyVerdictBucket'
        type: array
      clone_agreed:
        type: integer
      clone_total:
        type: integer
      coverage:
        items:
          $ref: '#/definitions/ttgo_pkg_tracker_store.AIAccuracyCoverage'
        type: array
      direct_agreed:
        type: integer
      direct_rate:
        type: number
      direct_total:
        type: integer
      policy_version:
        description: |-
          PolicyVersion echoes the filter ("" = all versions). PolicyVersions lists every version
          present in the window, ignoring the filter, so the UI's dropdown stays stable.
        type: string
      policy_versions:
        items:
          type: string
        type: array
      total:
        type: integer
      unknown_provenance:
        description: |-
          UnknownProvenance counts calibration rows decided before the split was recorded: in Total,
          in neither half of the split, and never in a specific policy version.
        type: integer
    type: object
  ttgo_pkg_tracker_store.AISeedGroundTruth:
    properties:
      expected_defect_type:
        type: string
      expected_verdict:
        type: string
      failure_type:
        type: string
      latest_run_rows:
        type: integer
      sample_message:
        type: string
      scenario:
        type: string
      template_key:
        type: string
      total_rows:
        type: integer
    type: object
  ttgo_pkg_tracker_store.AffectedTestCase:
    properties:
      id:
        type: string
      last_result_status:
        type: string
      last_run_id:
        type: string
      last_run_name:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Test tracking and run management REST API.
  title: TTGO API
  version: "1.0"
paths:
  /admin/reset:
    delete:
      consumes:
      - application/json
      description: 'Erase ALL application data (test cases, runs, folders, etc.) while
        preserving user accounts. Requires confirmation body {"confirm": "CONFIRM
        RESET"}. Admin only.'
      parameters:
      - description: Confirmation payload
        in: body
        name: body
        required: true
        schema:
          properties:
            confirm:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reset all data
      tags:
      - admin
  /ai-generations:
    get:
      parameters:
      - description: Requirement ID
        in: query
        name: requirement_id
        required: true
        type: string
      - description: Max runs (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List AI generation runs for a requirement
      tags:
      - ai-generations
    post:
      consumes:
      - application/json
      description: Creates an idempotent generation run for a requirement, calls the
        configured LLM provider with structured output, validates and persists the
        drafts, and returns the completed run. Replaying a finished idempotency key
        returns the stored result without calling the provider. 409 when AI features
        are switched off.
      parameters:
      - description: requirement_id (required), provider_id, coverage_level, detail_level,
          additional_instructions, idempotency_key, parent_run_id, run_critic
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an AI generation run
      tags:
      - ai-generations
  /ai-generations/{id}:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an AI generation run
      tags:
      - ai-generations
  /ai-generations/{id}/accept:
    post:
      consumes:
      - application/json
      description: Creates category subfolders, test cases with steps, and requirement
        links for the selected drafts in ONE transaction; any failure rolls back the
        whole batch. Replaying a fully-accepted selection returns the stored test-case
        IDs.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: folder_id, draft_ids, group_by_category, idempotency_key
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Accept generated drafts
      tags:
      - ai-generations
  /ai-generations/{id}/cancel:
    post:
      description: Fires the in-flight run's cancellation (202). A stale `running`
        run (e.g. after a server restart) is stamped cancelled (200). Terminal runs
        conflict (409).
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel an AI generation run
      tags:
      - ai-generations
  /ai-generations/{id}/drafts/{draft_id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft ID
        in: path
        name: draft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Edit a generated draft
      tags:
      - ai-generations
  /ai-generations/{id}/drafts/{draft_id}/choose:
    post:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft ID to keep
        in: path
        name: draft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Choose a draft version
      tags:
      - ai-generations
  /ai-generations/{id}/drafts/{draft_id}/regenerate:
    post:
      consumes:
      - application/json
      description: Calls the provider with a focused revision prompt and persists
        the result as a NEW pending alternative (original untouched, versions retained).
        Choose between them via the choose endpoint. 409 when AI features are switched
        off.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft ID
        in: path
        name: draft_id
        required: true
        type: string
      - description: instruction, action (make_more_specific|add_negative_case|repair_findings),
          finding_codes
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Regenerate one AI draft
      tags:
      - ai-generations
  /ai-generations/{id}/drafts/{draft_id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft ID
        in: path
        name: draft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a generated draft
      tags:
      - ai-generations
  /ai-generations/{id}/drafts/{draft_id}/restore:
    post:
      description: Moves a rejected draft back to pending and records a `restored`
        lifecycle event.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft ID
        in: path
        name: draft_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore a rejected AI draft
      tags:
      - ai-generations
  /ai-generations/reports/summary:
    get:
      description: 'Aggregated run outcomes, draft feedback (accepted unchanged/edited,
        rejected with reasons, superseded), token/cost totals, and provider comparisons
        for a date window (default last 30 days). Includes an analysis block: failure-analysis
        cost in the same window (cost_usd, typesafe_cost_usd, llm_cost_usd, explain_cost_usd,
        events).'
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: YYYY-MM-DD (inclusive)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: AI generation summary report
      tags:
      - ai-generations
  /ai/failure-analysis/accuracy:
    get:
      description: Agreement between the AI's suggested defect_type and the human
        triage decision over a rolling window, overall and broken down by the snapshotted
        verdict, confidence and engine. Each engine and the totals are split into
        direct predictions and dedup clones (a group representative's answer copied
        onto a sibling); decisions recorded before that split existed count in the
        totals only (unknown_provenance). coverage reports, per engine, the representative
        analyses created in the window and how many decided, abstained, failed or
        lack an explanation. policy_version narrows everything to suggestions made
        under one TypeSafe policy version; policy_versions lists every version in
        the window. The window is measured on the moment the decision was recorded.
        Only explicitly triaged failing results (FAIL or ERROR) that carried a suggestion
        at the decision moment are counted; results still at the "to_investigate"
        auto-default and results with no suggestion are excluded rather than counted
        as disagreements.
      parameters:
      - default: 30
        description: Rolling window in days, counted from the triage decision (1-365)
        in: query
        name: days
        type: integer
      - description: Only suggestions made under this TypeSafe policy version (empty
          = all versions)
        in: query
        name: policy_version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ttgo_pkg_tracker_store.AIFailureAnalysisAccuracy'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: AI failure-analysis accuracy
      tags:
      - ai-failure-analysis
  /analytics/flaky:
    get:
      description: Returns tests ranked by status-switch percentage
      parameters:
      - default: 30
        description: Number of recent runs to analyze per test
        in: query
        name: lookback
        type: integer
      - default: 20
        description: Max results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Detect flaky tests (switch method)
      tags:
      - analytics
  /analytics/summary:
    get:
      description: Returns an aggregated summary of test run analytics
      produces:
      - application/json
      responses:
        "200":
          description: Analytics summary object
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get analytics summary
      tags:
      - analytics
  /analytics/trend:
    get:
      description: Returns time-series trend data for test runs over a given number
        of days
      parameters:
      - default: 30
        description: Number of days to include in the trend
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Trend points array and days count
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get trend data
      tags:
      - analytics
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the currently authenticated user's password. Requires session
        cookie.
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          properties:
            current_password:
              type: string
            new_password:
              type: string
          type: object
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - SessionCookie: []
      summary: Change password
      tags:
      - auth
  /auth/login:
