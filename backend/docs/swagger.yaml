  /runs/{id}/results/bulk-update:
    post:
      consumes:
      - application/json
      description: 'Applies the same status and/or defect_type to multiple results
        within a run. At least one of the two is required. When status is given it
        is applied to every selected result; for a failure status (FAIL or ERROR)
        defect_type defaults to "to_investigate" when not given, and every other status
        clears it. When status is omitted the request is a triage-only decision: defect_type
        is applied without touching status, and only to results whose stored status
        is FAIL or ERROR — the rest are left untouched and reported in "skipped".
        "updated" counts the rows actually written, so repeated ids and ids outside
        this run land in "skipped" rather than being reported as writes.'
      parameters:
      - description: Test run ID
        in: path
        name: id
        required: true
        type: string
      - description: Result IDs and the status/defect_type to apply
        in: body
        name: body
        required: true
        schema:
          properties:
            defect_type:
              type: string
            result_ids:
              items:
                type: string
              type: array
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              skipped:
                type: integer
              status:
                type: string
              updated:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Bulk update run results
      tags:
      - runs
