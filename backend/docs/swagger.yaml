      description: 'Applies the same status, severity and/or assignee to many defects
        in one call. Omitted (null) fields are left unchanged; assignee_id "" clears
        the assignee across the whole selection. Unknown ids are tolerated — they
        simply match nothing — and the response carries the defects that exist, enriched
        with assignee_name and linked_test_count exactly like GET /defects. A request
        that sets no field at all is a read-back: nothing is written and updated_at
        is left alone, because that column is the staleness signal.'
      parameters:
      - description: Defect IDs and the fields to apply
        in: body
        name: body
